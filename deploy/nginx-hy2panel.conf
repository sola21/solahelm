# Фрагмент для nginx на Windows-сервере (вариант без WSL).
# Вставьте блоки location внутрь СУЩЕСТВУЮЩЕГО server { ... } сайта panel.example.com (тот, что слушает 443 ssl).
# Адреса: клиенты https://panel.example.com/hy/ , админка https://panel.example.com/hy/admin/
# Пути должны совпадать с HY_BASE_PATH (/hy) и HY_ADMIN_PATH (admin) в .env панели.
#
# proxy_pass:
#   панель на этой же машине          -> http://127.0.0.1:8088
#   панель на другой машине/ВМ в LAN  -> http://192.168.1.X:8088  (и укажите IP nginx в HY_TRUSTED_PROXIES)

    # Подписки клиентов: открыты в интернет (защищены длинным случайным токеном), только GET
    location /hy/sub/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_except GET { deny all; }
    }

    # Админка (префикс длиннее, чем у /hy/, поэтому выигрывает)
    location /hy/admin/ {
        # Рекомендуется ограничить доступ: LAN и ваши внешние IP.
        # allow 192.168.1.0/24;
        # allow <ваш_внешний_IP>;
        # deny all;

        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;     # установка/синхронизация по SSH может идти долго
        client_max_body_size 2m;
    }
    location = /hy/admin { return 301 /hy/admin/; }

    # Кабинет клиентов и файлы оформления: открыты в интернет
    location /hy/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
    location = /hy { return 301 /hy/; }

    # Если панель раньше была по другому адресу (например /hy-admin), добавьте и его,
    # а в .env укажите HY_LEGACY_BASE=/hy-admin: подписки по старым ссылкам продолжат работать.
    # location /hy-admin/ {
